<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>东莞首靠船识别助手 · 日报看板</title>
<script src="auth-guard.js"></script>
<script src="ship-data.js"></script>
<script src="plan-store.js"></script>
<script src="rule-engine.js"></script>
<script src="data-sources.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script defer src="nanobot-chat.js?v=3"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Microsoft YaHei","微软雅黑",sans-serif;background:#f0f4f8;color:#333;line-height:1.6}
  .container{max-width:1400px;margin:0 auto;padding:20px}
  
  .header{background:linear-gradient(135deg,#1a3a5c 0%,#2c5f8e 100%);color:#fff;padding:22px 30px;border-radius:12px 12px 0 0;box-shadow:0 4px 20px rgba(26,58,92,0.3);display:flex;justify-content:space-between;align-items:center}
  .header h1{font-size:24px;font-weight:700;letter-spacing:2px}
  .header .date-input{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:#fff;padding:8px 16px;border-radius:8px;font-size:14px;outline:none}
  .header .date-input::placeholder{color:rgba(255,255,255,0.6)}
  
  .card{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.06);margin-bottom:20px;overflow:hidden}
  .card-header{background:linear-gradient(90deg,#2c5f8e 0%,#4a8bc2 100%);color:#fff;padding:12px 20px;font-size:15px;font-weight:700}
  
  /* 统计面板 */
  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin:20px 0}
  .stat-box{background:#fff;border-radius:12px;padding:20px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.06);border-top:4px solid #2c5f8e;transition:.2s}
  .stat-box:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,.1)}
  .stat-num{font-size:32px;font-weight:800}
  .stat-label{font-size:12px;color:#7a8fa8;margin-top:6px;font-weight:600}
  .stat-box.low{border-top-color:#27ae60}
  .stat-box.low .stat-num{color:#27ae60}
  .stat-box.mid{border-top-color:#f39c12}
  .stat-box.mid .stat-num{color:#f39c12}
  .stat-box.high{border-top-color:#e74c3c}
  .stat-box.high .stat-num{color:#e74c3c}
  .stat-box.key{border-top-color:#9b59b6}
  .stat-box.key .stat-num{color:#9b59b6}
  .stat-box.veto{border-top-color:#c0392b}
  .stat-box.veto .stat-num{color:#c0392b}
  
  /* 表格 */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{background:#e8f1fa;color:#1a3a5c;padding:12px 8px;font-weight:700;font-size:12px;text-align:center;border-bottom:2px solid #d0dae6;position:sticky;top:0}
  td{padding:10px 8px;text-align:center;border-bottom:1px solid #f0f4f8}
  tr:hover td{background:#f8fafc}
  td input,td select{width:100%;border:1px solid #dde5ef;padding:5px 6px;border-radius:6px;font-size:12px;outline:none;background:#fafbfc;text-align:center}
  td input:focus,td select:focus{border-color:#2c5f8e;background:#fff}
  
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
  .bg-low{background:#d4edda;color:#155724}
  .bg-mid{background:#fff3cd;color:#856404}
  .bg-high{background:#f8d7da;color:#721c24}
  .bg-key{background:#e8daef;color:#5b2c6f}
  
  /* 图表区 */
  .charts{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
  .chart-box{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.06);padding:16px}
  .chart-title{font-size:14px;font-weight:700;color:#1a3a5c;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #e8ecf1}
  .chart-container{height:280px}
  
  /* 按钮 */
  .btn-bar{display:flex;gap:12px;margin:16px 0;justify-content:flex-end}
  .btn{padding:8px 20px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
  .btn-add{background:linear-gradient(135deg,#27ae60,#2ecc71);color:#fff}
  .btn-add:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(39,174,96,.3)}
  .btn-del{background:#e74c3c;color:#fff}
  .btn-del:hover{background:#c0392b}
  .btn-print{background:linear-gradient(135deg,#2c5f8e,#4a8bc2);color:#fff}
  .btn-print:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(44,95,142,.3)}
  
  @media print{
    body{background:#fff}
    .btn-bar{display:none}
    .charts{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>
<div class="container">

<div class="header">
  <h1>东莞首靠船识别助手 · 日报看板</h1>
  <input class="date-input" id="boardDate" type="date" placeholder="选择日期">
</div>

<!-- 统计面板 -->
<div class="stats">
  <div class="stat-box low">
    <div class="stat-num" id="stLow">0</div>
    <div class="stat-label">🟢 低风险</div>
  </div>
  <div class="stat-box mid">
    <div class="stat-num" id="stMid">0</div>
    <div class="stat-label">🟡 中风险</div>
  </div>
  <div class="stat-box high">
    <div class="stat-num" id="stHigh">0</div>
    <div class="stat-label">🔴 高风险</div>
  </div>
  <div class="stat-box key">
    <div class="stat-num" id="stKey">0</div>
    <div class="stat-label">⚠️ 重点船舶</div>
  </div>
  <div class="stat-box veto">
    <div class="stat-num" id="stVeto">0</div>
    <div class="stat-label">❌ 一票否决</div>
  </div>
</div>

<!-- 图表 -->
<div class="charts">
  <div class="chart-box">
    <div class="chart-title">📊 风险等级分布</div>
    <div class="chart-container" id="pieChart"></div>
  </div>
  <div class="chart-box">
    <div class="chart-title">📈 四维度平均风险得分</div>
    <div class="chart-container" id="barChart"></div>
  </div>
</div>

<!-- 表格 -->
<div class="card">
  <div class="card-header">当日首靠船明细</div>
  <div style="padding:16px;overflow-x:auto">
    <div class="btn-bar">
      <button class="btn btn-print" style="background:linear-gradient(135deg,#9b59b6,#8e44ad)" onclick="loadFromEngine()">⚡ 加载船舶库</button>
      <button class="btn btn-print" style="background:linear-gradient(135deg,#00a896,#02c39a)" onclick="loadFromPlanStore()">📦 加载计划库</button>
      <button class="btn btn-add" onclick="addRow()">➕ 添加船舶</button>
      <button class="btn btn-del" onclick="delLastRow()">➖ 删除末行</button>
      <button class="btn btn-print" onclick="window.print()">🖨️ 打印看板</button>
    </div>
    <table id="shipTable">
      <thead>
        <tr>
          <th>序号</th><th>船名</th><th>IMO</th><th>ETA</th><th>船型</th>
          <th>风险等级</th><th>重点船舶</th><th>桥梁净空</th><th>驾驶员首航</th>
          <th>引航</th><th>泊位匹配</th><th>一票否决</th><th>评估人</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr>
          <td>1</td>
          <td><input placeholder="船名"></td>
          <td><input placeholder="IMO"></td>
          <td><input placeholder="08:30"></td>
          <td><input placeholder="散货船"></td>
          <td>
            <select onchange="updateStats()">
              <option value="">-</option>
              <option value="low">🟢 低风险</option>
              <option value="mid">🟡 中风险</option>
              <option value="high">🔴 高风险</option>
            </select>
          </td>
          <td>
            <select onchange="updateStats()">
              <option value="">-</option>
              <option value="key">⚠️ 重点</option>
              <option value="normal">普通</option>
            </select>
          </td>
          <td><input placeholder="正常"></td>
          <td><input placeholder="熟悉"></td>
          <td><input placeholder="自航"></td>
          <td><input placeholder="正常"></td>
          <td>
            <select onchange="updateStats()">
              <option value="">-</option>
              <option value="no">未触发</option>
              <option value="yes">已触发</option>
            </select>
          </td>
          <td><input placeholder="姓名"></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

</div>

<script>
let pieChart, barChart;

document.addEventListener('DOMContentLoaded', function(){
  document.getElementById('boardDate').valueAsDate = new Date();
  
  pieChart = echarts.init(document.getElementById('pieChart'));
  barChart = echarts.init(document.getElementById('barChart'));
  
  pieChart.setOption({
    tooltip:{trigger:'item',formatter:'{b}: {c}艘 ({d}%)'},
    legend:{bottom:0,left:'center',textStyle:{fontSize:11}},
    color:['#27ae60','#f1c40f','#e74c3c','#9b59b6'],
    series:[{
      type:'pie',radius:['40%','65%'],center:['50%','45%'],
      label:{show:true,formatter:'{b}\n{c}艘',fontSize:12},
      data:[{value:0,name:'🟢 低风险'},{value:0,name:'🟡 中风险'},{value:0,name:'🔴 高风险'},{value:0,name:'⚠️ 重点'}]
    }]
  });
  
  barChart.setOption({
    tooltip:{trigger:'axis'},
    grid:{left:'3%',right:'4%',bottom:'3%',containLabel:true},
    xAxis:{type:'category',data:['船舶固有','历史绩效','船员配员','航行通航'],axisLabel:{fontSize:11,color:'#5a7a96'}},
    yAxis:{type:'value',max:40,axisLabel:{fontSize:11,color:'#5a7a96'}},
    series:[{
      type:'bar',barWidth:'50%',
      data:[0,0,0,0],
      itemStyle:{borderRadius:[6,6,0,0],color:function(p){
        const colors=['#2c5f8e','#4a8bc2','#6ab0d8','#8ecae6'];
        return colors[p.dataIndex];
      }},
      label:{show:true,position:'top',fontSize:12,fontWeight:'bold'}
    }]
  });
  
  window.addEventListener('resize',()=>{pieChart.resize();barChart.resize();});
  updateStats();
});

function addRow(){
  let tbody = document.getElementById('tableBody');
  let idx = tbody.children.length + 1;
  let tr = document.createElement('tr');
  tr.innerHTML = `
    <td>${idx}</td>
    <td><input placeholder="船名"></td>
    <td><input placeholder="IMO"></td>
    <td><input placeholder="ETA"></td>
    <td><input placeholder="船型"></td>
    <td><select onchange="updateStats()"><option value="">-</option><option value="low">🟢 低风险</option><option value="mid">🟡 中风险</option><option value="high">🔴 高风险</option></select></td>
    <td><select onchange="updateStats()"><option value="">-</option><option value="key">⚠️ 重点</option><option value="normal">普通</option></select></td>
    <td><input placeholder="正常"></td>
    <td><input placeholder="熟悉"></td>
    <td><input placeholder="自航"></td>
    <td><input placeholder="正常"></td>
    <td><select onchange="updateStats()"><option value="">-</option><option value="no">未触发</option><option value="yes">已触发</option></select></td>
    <td><input placeholder="姓名"></td>
  `;
  tbody.appendChild(tr);
  updateStats();
}

function delLastRow(){
  let tbody = document.getElementById('tableBody');
  if(tbody.children.length>1) tbody.removeChild(tbody.lastElementChild);
  updateStats();
}

function updateStats(){
  let rows = document.querySelectorAll('#tableBody tr');
  let low=0,mid=0,high=0,key=0,veto=0;
  
  rows.forEach(tr=>{
    let lvl = tr.children[5].querySelector('select').value;
    let k = tr.children[6].querySelector('select').value;
    let v = tr.children[11].querySelector('select').value;
    if(lvl==='low') low++;
    if(lvl==='mid') mid++;
    if(lvl==='high') high++;
    if(k==='key') key++;
    if(v==='yes') veto++;
  });
  
  document.getElementById('stLow').textContent = low;
  document.getElementById('stMid').textContent = mid;
  document.getElementById('stHigh').textContent = high;
  document.getElementById('stKey').textContent = key;
  document.getElementById('stVeto').textContent = veto;
  
  if(pieChart){
    pieChart.setOption({series:[{data:[
      {value:low,name:'🟢 低风险'},
      {value:mid,name:'🟡 中风险'},
      {value:high,name:'🔴 高风险'},
      {value:key,name:'⚠️ 重点'}
    ]}]});
  }
  // 柱状图：基于规则引擎计算的真实四维度平均得分
  if(barChart){
    barChart.setOption({series:[{data: computeAvgDims()}]});
  }
}

// 调引擎对每艘船跑一次，按四维度（PSC/船龄=船舶固有, PSC=历史绩效, 配员, 货种/航线）平均
function computeAvgDims(){
  if(!window.RuleEngine || !Array.isArray(window.SHIP_LIST) || !window.SHIP_LIST.length) return [0,0,0,0];
  // 四维度映射：船舶固有=age+flag, 历史绩效=psc, 船员配员=crew, 航行通航=cargo
  const buckets = { intrinsic:[], psc:[], crew:[], nav:[] };
  window.SHIP_LIST.forEach(s => {
    try{
      const r = window.RuleEngine.evalShip(s);
      if(!r || !r.dims) return;
      const dimMap = {};
      r.dims.forEach(d => { dimMap[d.k] = d.score; });
      buckets.intrinsic.push((dimMap.age||0) + (dimMap.flag||0));
      buckets.psc.push(dimMap.psc || 0);
      buckets.crew.push(dimMap.crew || 0);
      buckets.nav.push(dimMap.cargo || 0);
    }catch(e){}
  });
  const avg = arr => arr.length ? Math.round(arr.reduce((a,b)=>a+b,0) / arr.length * 10) / 10 : 0;
  return [avg(buckets.intrinsic), avg(buckets.psc), avg(buckets.crew), avg(buckets.nav)];
}

// 一键从船舶库 + 规则引擎自动填充表格
function loadFromEngine(){
  if(!window.SHIP_LIST || !window.SHIP_LIST.length){
    alert('未检测到船舶数据源（ship-data.js）');
    return;
  }
  if(!confirm(`将清空当前表格并从船舶库导入 ${window.SHIP_LIST.length} 艘船舶（已跑规则引擎计算等级），是否继续？`)) return;
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  const lvKey = lv => lv==='高' ? 'high' : lv==='中' ? 'mid' : 'low';
  window.SHIP_LIST.forEach((s, i) => {
    let level = s.level || '低', veto = !!s.veto;
    try{
      if(window.RuleEngine){
        const r = window.RuleEngine.evalShip(s);
        if(r && r.hits && r.hits.length){ level = r.level; veto = r.veto; }
      }
    }catch(e){}
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${i+1}</td>
      <td><input value="${s.name||''}"></td>
      <td><input value="${s.imo||''}"></td>
      <td><input value="${(s.eta||'').replace(/.*\s/,'')}"></td>
      <td><input value="${s.type||''}"></td>
      <td><select onchange="updateStats()">
        <option value="">-</option>
        <option value="low" ${lvKey(level)==='low'?'selected':''}>🟢 低风险</option>
        <option value="mid" ${lvKey(level)==='mid'?'selected':''}>🟡 中风险</option>
        <option value="high" ${lvKey(level)==='high'?'selected':''}>🔴 高风险</option>
      </select></td>
      <td><select onchange="updateStats()">
        <option value="">-</option>
        <option value="key" ${level==='高'?'selected':''}>⚠️ 重点</option>
        <option value="normal" ${level!=='高'?'selected':''}>普通</option>
      </select></td>
      <td><input value="正常"></td>
      <td><input value="${level==='高'?'首航':'熟悉'}"></td>
      <td><input value="${level==='高'?'强制':'自航'}"></td>
      <td><input value="正常"></td>
      <td><select onchange="updateStats()">
        <option value="">-</option>
        <option value="no" ${!veto?'selected':''}>未触发</option>
        <option value="yes" ${veto?'selected':''}>已触发</option>
      </select></td>
      <td><input placeholder="姓名"></td>
    `;
    tbody.appendChild(tr);
  });
  updateStats();
}
function loadFromPlanStore(){
  if(!window.PlanStore){ alert('未加载 plan-store.js'); return; }
  var all = PlanStore.getAll();
  if(!all.length){ alert('计划库暂无数据，请先在计划上传页上传 Excel'); return; }
  if(!confirm(`将从计划库导入 ${all.length} 行船舶记录（覆盖现有表格），是否继续？`)) return;
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  all.forEach(function(p, i){
    // 规则引擎评估
    var ev = null;
    try { if(window.RuleEngine) ev = RuleEngine.evalPlanRow(p); } catch(e){}
    var riskSel = '', riskCls = '';
    if(ev){
      if(ev.level === '高') riskSel = 'high';
      else if(ev.level === '中') riskSel = 'mid';
      else riskSel = 'low';
    } else { riskSel = 'low'; }
    var tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${i+1}</td>
      <td><input value="${p.shipName||''}"></td>
      <td><input value=""></td>
      <td><input value="${(p.eta||'').slice(0,5)}"></td>
      <td><input value="${p.shipType||''}"></td>
      <td><select onchange="updateStats()">
        <option value="">-</option>
        <option value="low" ${riskSel==='low'?'selected':''}>🟢 低风险${ev?' ('+ev.score+'分)':''}</option>
        <option value="mid" ${riskSel==='mid'?'selected':''}>🟡 中风险${ev?' ('+ev.score+'分)':''}</option>
        <option value="high" ${riskSel==='high'?'selected':''}>🔴 高风险${ev?' ('+ev.score+'分)':''}</option>
      </select></td>
      <td><select onchange="updateStats()">
        <option value="">-</option>
        <option value="key" ${ev&&ev.level==='高'?'selected':''}>⚠️ 重点</option>
        <option value="normal" ${!ev||ev.level!=='高'?'selected':''}>普通</option>
      </select></td>
      <td><input value="正常"></td>
      <td><input value="${ev&&ev.hits.length>0?ev.hits[0].name:'熟悉'}"></td>
      <td><input value="自航"></td>
      <td><input value="正常"></td>
      <td><select onchange="updateStats()">
        <option value="" selected>-</option>
        <option value="no">未触发</option>
        <option value="yes">已触发</option>
      </select></td>
      <td><input value="${p.captain||''}"></td>
    `;
    tbody.appendChild(tr);
  });
  updateStats();
}
</script>
<script>
  document.addEventListener('DOMContentLoaded',()=>{
    const bindNb=()=>{
      if(!window.NanobotChat) return setTimeout(bindNb,80);
      NanobotChat.setContext(`你是「东莞首靠船识别助手 · Nanobot」，当前页面：日报看板（V1.2 早期版本）。\n用户在查看每日首靠船统计图表，可回答日报数据解读、风险趋势、对比环比类问题。\n回答风格：精炼、数字优先。`);
      NanobotChat.injectFloatingButton();
    };
    bindNb();
  });
</script>
</body>
</html>
