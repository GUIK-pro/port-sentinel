server {
    listen 80;
    server_name 8.138.20.171;

    # ====== 项目根目录（宝塔创建站点时填这个路径） ======
    root /www/wwwroot/port-sentinel;
    index login.html index.html;

    # ====== 静态文件（默认走 Nginx） ======
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ====== Nanobot API 反向代理 ======
    # 前端 /v1/* 请求 → 转发到本机 Nanobot 8900 端口
    location /v1/ {
        proxy_pass http://127.0.0.1:8900/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE 流式响应（AI 对话必需）
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 120s;
    }

    # ====== Nanobot 健康检查 ======
    location /api/health {
        proxy_pass http://127.0.0.1:8900/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 5s;
    }

    # ====== 静态资源缓存 ======
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ====== 安全：禁止访问隐藏文件 ======
    location ~ /\. {
        deny all;
    }

    # ====== 访问日志（宝塔面板可查看） ======
    access_log /www/wwwlogs/port-sentinel.log;
    error_log  /www/wwwlogs/port-sentinel.error.log;
}
