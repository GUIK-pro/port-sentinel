<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>东莞首靠船识别助手 · 进出港计划查询</title>
<script src="auth-guard.js"></script>
<script src="ship-data.js"></script>
<script src="plan-store.js"></script>
<script src="rule-engine.js"></script>
<script src="data-sources.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script defer src="nanobot-chat.js?v=3"></script>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --line:#e6e9ef;
    --ink:#0b1220; --ink-2:#475569; --ink-3:#94a3b8;
    --naval:#0a1f44; --naval-2:#142b5c; --teal:#00a896; --teal-2:#02c39a;
    --low:#059669; --mid:#d97706; --high:#dc2626; --veto:#7f1d1d;
  }
  html,body{background:var(--bg); color:var(--ink); font-family:'Geist','Noto Sans SC',ui-sans-serif,system-ui,sans-serif; -webkit-font-smoothing:antialiased;}
  .mono{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace; font-feature-settings:"tnum" 1,"ss01" 1;}
  [x-cloak]{display:none !important;}
  kbd{font-family:'Geist Mono',monospace; font-size:10px; padding:1px 5px; border:1px solid rgba(255,255,255,.18); border-bottom-width:2px; border-radius:5px; background:rgba(255,255,255,.06); color:rgba(255,255,255,.78);}

  .topbar{background:linear-gradient(180deg,#0a1f44 0%,#0b234d 100%); color:#fff;}
  .sidebar{background:#0a1f44; color:#cbd5e1;}
  .nav-item{transition:all .18s ease;}
  .nav-item.active{background:rgba(0,168,150,.12); color:#fff; box-shadow:inset 2px 0 0 #00a896;}
  .nav-item:not(.active):hover{background:rgba(255,255,255,.05); color:#fff;}

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:22px;}
  .pill{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; font-size:11px; border-radius:6px; font-weight:500;}
  .pill-ok{background:#ecfdf5; color:#047857; border:1px solid #a7f3d0;}
  .pill-warn{background:#fffbeb; color:#b45309; border:1px solid #fde68a;}
  .pill-err{background:#fef2f2; color:#b91c1c; border:1px solid #fecaca;}
  .pill-info{background:rgba(0,168,150,.08); color:#047b6e; border:1px solid rgba(0,168,150,.25);}

  .tbl{width:100%; border-collapse:separate; border-spacing:0;}
  .tbl thead th{font-size:11px; font-weight:600; color:#64748b; text-align:left; padding:10px 14px; background:#f8fafc; border-bottom:1px solid #eef1f6; letter-spacing:.04em; text-transform:uppercase; position:sticky; top:0; z-index:1;}
  .tbl tbody td{font-size:13px; color:#0b1220; padding:12px 14px; border-bottom:1px solid #f1f4f9;}
  .tbl tbody tr:hover{background:#fafbfd;}
  .tbl tbody tr:last-child td{border-bottom:0;}

  [data-stagger]{opacity:0; transform:translateY(8px); animation:reveal .5s cubic-bezier(.2,.8,.2,1) forwards;}
  [data-stagger]:nth-child(1){animation-delay:.05s;}
  [data-stagger]:nth-child(2){animation-delay:.12s;}
  [data-stagger]:nth-child(3){animation-delay:.19s;}
  [data-stagger]:nth-child(4){animation-delay:.26s;}
  @keyframes reveal{to{opacity:1; transform:translateY(0);}}

  .ring-teal{box-shadow:0 0 0 3px rgba(0,168,150,.16);}

  .palette-mask{background:rgba(7,14,30,.55); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);}
  .palette{background:#0b1230; border:1px solid rgba(255,255,255,.08); box-shadow:0 30px 80px -20px rgba(2,6,23,.7);}

  .search-input{transition:all .2s ease;}
  .search-input:focus{box-shadow:0 0 0 3px rgba(0,168,150,.18); border-color:#00a896;}

  .chip{display:inline-flex; align-items:center; gap:4px; padding:4px 10px; font-size:11px; border-radius:8px; border:1px solid #e2e8f0; background:#f8fafc; color:#475569; cursor:pointer; transition:all .15s ease;}
  .chip:hover{border-color:#00a896; background:rgba(0,168,150,.04); color:#047b6e;}
  .chip.active{border-color:#00a896; background:rgba(0,168,150,.10); color:#047b6e; font-weight:500;}

  .page-btn{min-width:32px; height:32px; display:inline-flex; align-items:center; justify-content:center; border-radius:8px; font-size:12px; border:1px solid #e2e8f0; background:#fff; color:#475569; cursor:pointer; transition:all .15s ease;}
  .page-btn:hover{border-color:#00a896; color:#047b6e;}
  .page-btn.active{background:#0a1f44; color:#fff; border-color:#0a1f44;}
  .page-btn:disabled{opacity:.4; cursor:not-allowed;}

  .detail-drawer{transition:transform .3s cubic-bezier(.2,.8,.2,1);}
  .detail-mask{background:rgba(7,14,30,.4); backdrop-filter:blur(4px);}
</style>
</head>
<body class="min-h-screen" x-data="historyApp()" x-init="init()" x-cloak>

<!-- ============== TOPBAR ============== -->
<header class="topbar h-14 flex items-center px-5 border-b border-white/5 sticky top-0 z-30">
  <div class="flex items-center gap-3">
    <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-[#00a896] to-[#02c39a] grid place-items-center shadow-lg shadow-teal-500/20">
      <svg viewBox="0 0 24 24" class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 12h18M12 3v18M5.5 5.5l13 13M18.5 5.5l-13 13"/></svg>
    </div>
    <div class="leading-tight">
      <div class="text-[13px] font-semibold tracking-wide">东莞首靠船识别助手</div>
      <div class="text-[10.5px] text-white/55 mono tracking-wider">PORT CALL HISTORY · v2.2</div>
    </div>
  </div>

  <div class="ml-8 flex-1 max-w-md relative">
    <input x-ref="globalSearch" type="text" x-model="globalQuery" @input="onSearch()" placeholder="全局搜索 IMO / MMSI / 船名 / 船长 / 泊位…" class="search-input w-full bg-white/[.06] border border-white/10 focus:bg-white/[.10] focus:border-teal-400/40 outline-none rounded-lg pl-9 pr-3 py-1.5 text-[12.5px] placeholder:text-white/35"/>
    <svg class="w-4 h-4 absolute left-2.5 top-1/2 -translate-y-1/2 text-white/40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
  </div>

  <div class="ml-auto flex items-center gap-2.5">
    <button @click="cmdkOpen=true" type="button" class="hidden md:flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-white/[.06] hover:bg-white/[.12] border border-white/10 transition text-[10.5px] text-white/70 hover:text-white" title="唤起 Nanobot · Cmd/Ctrl+K">
      <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V6a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/></svg>
      <span class="mono tracking-wider">Ask Nanobot</span>
      <span class="inline-flex items-center gap-0.5 ml-1 pl-1.5 border-l border-white/15"><kbd>⌘</kbd><kbd>K</kbd></span>
    </button>
    <div class="hidden lg:flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-white/[.04] border border-white/5">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
      <span class="text-[10.5px] text-white/70 mono">DATA ONLINE</span>
    </div>
    <div class="w-8 h-8 rounded-full bg-white/10 grid place-items-center text-[11px] font-semibold" x-text="currentUser ? currentUser.charAt(0) : '用'"></div>
  </div>
</header>

<div class="flex">
  <!-- ============== SIDEBAR ============== -->
  <aside class="sidebar w-[68px] min-h-[calc(100vh-56px)] sticky top-14 flex flex-col items-center py-4 gap-1.5">
    <template x-for="item in navItems" :key="item.id">
      <button @click="navigate(item)" class="nav-item w-12 h-12 rounded-xl flex flex-col items-center justify-center gap-0.5 text-[9.5px] mono tracking-wider" :class="item.active && 'active'">
        <span x-html="item.icon" class="w-4 h-4"></span>
        <span x-text="item.label"></span>
      </button>
    </template>
  </aside>

  <!-- ============== MAIN ============== -->
  <main class="flex-1 px-7 py-6 max-w-[1480px]">

    <!-- Page Hero -->
    <div class="flex items-end justify-between mb-5" data-stagger>
      <div>
        <div class="flex items-center gap-2 mb-1.5">
          <span class="pill pill-info mono">CHAIN · HISTORY · 6M ROLLING</span>
        </div>
        <h1 class="text-[26px] font-semibold tracking-tight" style="color:#0a1f44;">近 6 个月进出港计划</h1>
        <p class="text-[13px] text-slate-500 mt-1">滚动库全量数据 · 支持多维度搜索与筛选 · 每日 0 点自动归档</p>
      </div>
      <div class="flex items-center gap-2">
        <button @click="exportCSV()" class="px-3.5 py-2 rounded-lg border border-slate-200 hover:border-slate-300 hover:bg-slate-50 text-[12.5px] flex items-center gap-1.5 transition">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          导出 CSV
        </button>
        <button @click="location.href='plan-upload.html'" class="px-3.5 py-2 rounded-lg bg-[#0a1f44] text-white hover:bg-[#142b5c] text-[12.5px] flex items-center gap-1.5 transition shadow-sm">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          上传新计划
        </button>
      </div>
    </div>

    <!-- KPI Strip -->
    <div class="grid grid-cols-12 gap-4 mb-5">
      <template x-for="(kpi,idx) in kpis" :key="idx">
        <div class="col-span-3 panel px-5 py-4" data-stagger>
          <div class="flex items-center justify-between mb-2">
            <span class="text-[11px] text-slate-500 tracking-wide" x-text="kpi.label"></span>
            <span class="pill" :class="kpi.tone" x-text="kpi.delta"></span>
          </div>
          <div class="flex items-baseline gap-1.5">
            <span class="text-[28px] font-semibold mono tabular-nums" :style="`color:${kpi.color}`" x-text="kpi.value"></span>
            <span class="text-[11px] text-slate-400 mono" x-text="kpi.unit"></span>
          </div>
          <div class="text-[10.5px] text-slate-400 mt-1" x-text="kpi.note"></div>
        </div>
      </template>
    </div>

    <!-- Search & Filters -->
    <div class="panel p-5 mb-5" data-stagger>
      <div class="flex flex-wrap items-end gap-4">
        <!-- 关键词搜索 -->
        <div class="flex-1 min-w-[240px]">
          <label class="text-[11px] font-medium text-slate-500 tracking-wide mb-1.5 block">关键词搜索</label>
          <div class="relative">
            <input x-model="searchQuery" @input="onSearch()" type="text" placeholder="船名 / 船长 / 泊位 / 货物 / 船型…" class="search-input w-full bg-white border border-slate-200 rounded-xl pl-10 pr-4 py-2.5 text-[13px] outline-none placeholder:text-slate-300"/>
            <svg class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          </div>
        </div>
        <!-- 日期范围 -->
        <div>
          <label class="text-[11px] font-medium text-slate-500 tracking-wide mb-1.5 block">起始日期</label>
          <input x-model="dateFrom" @change="onSearch()" type="date" class="search-input bg-white border border-slate-200 rounded-xl px-3 py-2.5 text-[13px] outline-none"/>
        </div>
        <div>
          <label class="text-[11px] font-medium text-slate-500 tracking-wide mb-1.5 block">结束日期</label>
          <input x-model="dateTo" @change="onSearch()" type="date" class="search-input bg-white border border-slate-200 rounded-xl px-3 py-2.5 text-[13px] outline-none"/>
        </div>
        <!-- 重置 -->
        <button @click="resetFilters()" class="px-4 py-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 text-[12.5px] text-slate-600 transition flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          重置
        </button>
      </div>

      <!-- 船型快速筛选 -->
      <div class="flex flex-wrap items-center gap-2 mt-4 pt-4 border-t border-slate-100">
        <span class="text-[11px] text-slate-400 mr-1">船型筛选</span>
        <template x-for="t in shipTypes" :key="t">
          <button class="chip" :class="typeFilter===t && 'active'" @click="toggleTypeFilter(t)" x-text="t"></button>
        </template>
        <span class="text-[11px] text-slate-400 ml-3 mr-1">码头</span>
        <template x-for="b in berthOptions" :key="b">
          <button class="chip" :class="berthFilter===b && 'active'" @click="toggleBerthFilter(b)" x-text="b"></button>
        </template>
      </div>
    </div>

    <!-- Results Summary -->
    <div class="flex items-center justify-between mb-3">
      <div class="text-[12.5px] text-slate-500">
        共 <span class="mono font-semibold text-slate-700" x-text="filtered.length"></span> 条记录
        <span x-show="searchQuery || dateFrom || dateTo || typeFilter || berthFilter" class="text-[11px] text-teal-600 ml-2">（已筛选）</span>
      </div>
      <div class="flex items-center gap-2 text-[11.5px] text-slate-400">
        <span>每页</span>
        <select x-model.number="pageSize" @change="currentPage=1" class="bg-white border border-slate-200 rounded-lg px-2 py-1 text-[12px] outline-none">
          <option value="15">15</option>
          <option value="30">30</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
        <span>条</span>
      </div>
    </div>

    <!-- Data Table -->
    <div class="panel overflow-hidden mb-5" data-stagger>
      <div class="overflow-x-auto" style="max-height:68vh;">
        <table class="tbl">
          <thead>
            <tr>
              <th class="w-10">#</th>
              <th>日期</th>
              <th>船名</th>
              <th>船型</th>
              <th>船舶总吨</th>
              <th>最大长度</th>
              <th>靠泊码头</th>
              <th>进港时间</th>
              <th>离港时间</th>
              <th>船长</th>
              <th>联系方式</th>
              <th>货物种类</th>
              <th>航经桥梁</th>
              <th class="text-center">操作</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="(row, idx) in pagedRows" :key="idx + '-' + row.shipName + '-' + row.eta">
              <tr class="data-row">
                <td class="mono text-slate-400" x-text="(currentPage-1)*pageSize + idx + 1"></td>
                <td class="mono" x-text="row.date || '—'"></td>
                <td class="font-medium" x-text="row.shipName || '—'"></td>
                <td><span class="pill pill-info mono" x-text="row.shipType || '—'"></span></td>
                <td class="mono" x-text="row.gt ? Number(row.gt).toLocaleString() : '—'"></td>
                <td class="mono" x-text="row.maxLength || '—'"></td>
                <td x-text="row.berth || '—'"></td>
                <td class="mono text-slate-600" x-text="row.eta || '—'"></td>
                <td class="mono text-slate-600" x-text="row.etd || '—'"></td>
                <td x-text="row.captain || '—'"></td>
                <td class="mono text-slate-500 text-[12px]" x-text="row.phone || '—'"></td>
                <td x-text="row.cargo || '—'"></td>
                <td>
                  <template x-if="row.bridge && row.bridge !== '不适用'">
                    <span class="pill pill-warn" x-text="row.bridge"></span>
                  </template>
                  <template x-if="!row.bridge || row.bridge === '不适用'">
                    <span class="text-slate-400 text-[12px]">—</span>
                  </template>
                </td>
                <td class="text-center">
                  <button @click="showDetail(row)" class="text-[11.5px] text-teal-600 hover:text-teal-800 font-medium transition">详情</button>
                </td>
              </tr>
            </template>
            <tr x-show="pagedRows.length === 0">
              <td colspan="14" class="text-center py-12 text-slate-400">
                <svg class="w-10 h-10 mx-auto mb-3 text-slate-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                <div class="text-[13px]">未找到匹配的记录</div>
                <div class="text-[11.5px] mt-1">尝试调整搜索条件或重置筛选</div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Pagination -->
    <div class="flex items-center justify-between" x-show="totalPages > 1">
      <div class="text-[12px] text-slate-400">
        第 <span class="mono font-medium" x-text="currentPage"></span> / <span class="mono" x-text="totalPages"></span> 页
      </div>
      <div class="flex items-center gap-1.5">
        <button class="page-btn" @click="currentPage=1" :disabled="currentPage<=1">«</button>
        <button class="page-btn" @click="currentPage=Math.max(1,currentPage-1)" :disabled="currentPage<=1">‹</button>
        <template x-for="p in visiblePages" :key="p">
          <button class="page-btn" :class="p===currentPage && 'active'" @click="currentPage=p" x-text="p"></button>
        </template>
        <button class="page-btn" @click="currentPage=Math.min(totalPages,currentPage+1)" :disabled="currentPage>=totalPages">›</button>
        <button class="page-btn" @click="currentPage=totalPages" :disabled="currentPage>=totalPages">»</button>
      </div>
    </div>

  </main>
</div>

<!-- ============== DETAIL DRAWER ============== -->
<div x-show="detailOpen" x-transition.opacity class="detail-mask fixed inset-0 z-50" @click.self="detailOpen=false" @keydown.escape.window="detailOpen=false">
  <div x-show="detailOpen" x-transition class="detail-drawer absolute right-0 top-0 h-full w-[460px] max-w-[92vw] bg-white shadow-2xl overflow-y-auto">
    <template x-if="detailRow">
      <div class="p-6">
        <!-- Header -->
        <div class="flex items-center justify-between mb-6">
          <div>
            <div class="text-[10.5px] mono tracking-widest text-teal-600 mb-1">PLAN DETAIL</div>
            <h2 class="text-[20px] font-semibold" style="color:#0a1f44;" x-text="detailRow.shipName"></h2>
          </div>
          <button @click="detailOpen=false" class="w-8 h-8 rounded-lg border border-slate-200 grid place-items-center hover:bg-slate-50 transition">
            <svg class="w-4 h-4 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>

        <!-- Info Groups -->
        <div class="space-y-5">
          <div class="rounded-xl border border-slate-200 overflow-hidden">
            <div class="px-4 py-2.5 bg-slate-50 border-b border-slate-100 text-[11px] font-semibold text-slate-600 tracking-wide">基本信息</div>
            <div class="divide-y divide-slate-100">
              <div class="px-4 py-3 flex justify-between text-[12.5px]"><span class="text-slate-500">船名</span><span class="font-medium" x-text="detailRow.shipName"></span></div>
              <div class="px-4 py-3 flex justify-between text-[12.5px]"><span class="text-slate-500">船型</span><span x-text="detailRow.shipType || '—'"></span></div>
              <div class="px-4 py-3 flex justify-between text-[12.5px]"><span class="text-slate-500">船舶总吨</span><span class="mono" x-text="detailRow.gt ? Number(detailRow.gt).toLocaleString() : '—'"></span></div>
              <div class="px-4 py-3 flex justify-between text-[12.5px]"><span class="text-slate-500">最大长度</span><span class="mono" x-text="detailRow.maxLength || '—'"></span></div>
              <div class="px-4 py-3 flex justify-between text-[12.5px]"><span class="text-slate-500">日期</span><span class="mono" x-text="detailRow.date || '—'"></span></div>
            </div>
          </div>

          <div class="rounded-xl border border-slate-200 overflow-hidden">
            <div class="px-4 py-2.5 bg-slate-50 border-b border-slate-100 text-[11px] font-semibold text-slate-600 tracking-wide">行程时点</div>
            <div class="divide-y divide-slate-100">
              <div class="px-4 py-3 flex justify-between text-[12.5px]"><span class="text-slate-500">靠泊码头</span><span x-text="detailRow.berth || '—'"></span></div>
              <div class="px-4 py-3 flex justify-between text-[12.5px]"><span class="text-slate-500">进港时间</span><span class="mono" x-text="detailRow.eta || '—'"></span></div>
              <div class="px-4 py-3 flex justify-between text-[12.5px]"><span class="text-slate-500">离港时间</span><span class="mono" x-text="detailRow.etd || '—'"></span></div>
              <div class="px-4 py-3 flex justify-between text-[12.5px]"><span class="text-slate-500">航经桥梁</span><span x-text="detailRow.bridge || '—'"></span></div>
            </div>
          </div>

          <div class="rounded-xl border border-slate-200 overflow-hidden">
            <div class="px-4 py-2.5 bg-slate-50 border-b border-slate-100 text-[11px] font-semibold text-slate-600 tracking-wide">联络 & 货物</div>
            <div class="divide-y divide-slate-100">
              <div class="px-4 py-3 flex justify-between text-[12.5px]"><span class="text-slate-500">船长</span><span x-text="detailRow.captain || '—'"></span></div>
              <div class="px-4 py-3 flex justify-between text-[12.5px]"><span class="text-slate-500">联系方式</span><span class="mono" x-text="detailRow.phone || '—'"></span></div>
              <div class="px-4 py-3 flex justify-between text-[12.5px]"><span class="text-slate-500">货物种类</span><span x-text="detailRow.cargo || '—'"></span></div>
              <div class="px-4 py-3 flex justify-between text-[12.5px]"><span class="text-slate-500">货物数量</span><span class="mono" x-text="detailRow.cargoQty || '—'"></span></div>
            </div>
          </div>

          <div class="rounded-xl border border-slate-200 overflow-hidden">
            <div class="px-4 py-2.5 bg-slate-50 border-b border-slate-100 text-[11px] font-semibold text-slate-600 tracking-wide">入库信息</div>
            <div class="divide-y divide-slate-100">
              <div class="px-4 py-3 flex justify-between text-[12.5px]"><span class="text-slate-500">入库时间</span><span class="mono text-slate-500" x-text="detailRow.ingestAt ? detailRow.ingestAt.slice(0,16).replace('T',' ') : '—'"></span></div>
            </div>
          </div>
        </div>

        <!-- Actions -->
        <div class="flex gap-2 mt-6">
          <button @click="goToRiskReport(detailRow)" class="flex-1 px-4 py-2.5 rounded-xl bg-[#0a1f44] text-white text-[12.5px] font-medium hover:bg-[#142b5c] transition flex items-center justify-center gap-1.5">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            查看风险评估
          </button>
          <button @click="detailOpen=false" class="px-4 py-2.5 rounded-xl border border-slate-200 text-[12.5px] text-slate-600 hover:bg-slate-50 transition">关闭</button>
        </div>
      </div>
    </template>
  </div>
</div>

<!-- ============== COMMAND PALETTE ============== -->
<div x-show="cmdkOpen" x-transition.opacity class="palette-mask fixed inset-0 z-50 grid place-items-start pt-[14vh]" @click.self="cmdkOpen=false" @keydown.escape.window="cmdkOpen=false">
  <div x-show="cmdkOpen" x-transition class="palette w-[600px] max-w-[92vw] rounded-2xl overflow-hidden text-white">
    <div class="flex items-center gap-3 px-5 py-4 border-b border-white/5">
      <svg class="w-4 h-4 text-teal-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V6a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/></svg>
      <input x-ref="cmdkInput" type="text" placeholder="问 Nanobot：近6个月有多少油轮到港？哪些船航经虎门大桥？…" class="flex-1 bg-transparent outline-none text-[13.5px] placeholder:text-white/35"/>
      <kbd>ESC</kbd>
    </div>
    <div class="px-5 py-3.5">
      <div class="text-[10.5px] mono tracking-widest text-white/45 mb-2">建议问题</div>
      <ul class="space-y-1">
        <template x-for="q in suggestedQs" :key="q">
          <li :data-nb-ask="q" class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-white/[.06] cursor-pointer text-[12.5px] text-white/80">
            <svg class="w-3.5 h-3.5 text-teal-300/70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 2"/></svg>
            <span x-text="q"></span>
          </li>
        </template>
      </ul>
    </div>
    <div class="px-5 py-2.5 border-t border-white/5 flex items-center justify-between text-[10.5px] text-white/45 mono">
      <span>NANOBOT · LLM 兜底</span>
      <span class="flex gap-1.5"><kbd>↑</kbd><kbd>↓</kbd> 选择 <kbd>↵</kbd> 发送</span>
    </div>
  </div>
</div>

<script>
function historyApp(){
  return {
    cmdkOpen:false,
    currentUser:'',
    globalQuery:'',
    searchQuery:'',
    dateFrom:'',
    dateTo:'',
    typeFilter:'',
    berthFilter:'',
    pageSize:15,
    currentPage:1,
    allPlans:[],
    filtered:[],
    shipTypes:[],
    berthOptions:[],
    detailOpen:false,
    detailRow:null,
    navItems:[
      {id:'home',  label:'CMD',     icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>', href:'index.html'},
      {id:'upload',label:'UPLOAD',  icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>', href:'plan-upload.html'},
      {id:'query', label:'RISK',    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>', href:'risk-report.html'},
      {id:'daily', label:'DASH',    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M8 5v14"/></svg>', href:'daily-dashboard.html'},
      {id:'history',label:'HISTORY', active:true, icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>'},
      {id:'rules', label:'RULES',   icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>', href:'rules.html'},
      {id:'bot',   label:'BOT',     icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V6a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/></svg>'},
    ],
    kpis:[],
    suggestedQs:[
      '近6个月有多少油轮到港？',
      '哪些船航经虎门大桥？',
      '沙田港最近30天的进出港统计？',
      '总吨超过1万的船舶有哪些？',
    ],

    navigate(item){
      if(item.id==='bot'){ this.cmdkOpen=true; }
      else if(item.href && item.href!=='#'){ window.location.href=item.href; }
    },
    init(){
      try {
        var authRaw = localStorage.getItem('dgmsa_auth');
        if(authRaw){ this.currentUser = JSON.parse(authRaw).name || '未知'; }
      } catch(e){ this.currentUser = '未知'; }

      this.loadData();
      this.refreshKPI();

      window.addEventListener('keydown',(e)=>{
        const k=(e.key||'').toLowerCase();
        if((e.metaKey||e.ctrlKey)&&k==='k'){
          e.preventDefault();
          this.cmdkOpen=!this.cmdkOpen;
          if(this.cmdkOpen){this.$nextTick(()=>{this.$refs.cmdkInput&&this.$refs.cmdkInput.focus();});}
        } else if(k==='escape'&&this.cmdkOpen){this.cmdkOpen=false;}
      });

      const self=this;
      const bindNb=()=>{
        if(!window.NanobotChat) return setTimeout(bindNb,80);
        NanobotChat.setContext(`你是「东莞首靠船识别助手 · Nanobot」，当前页面：近6个月进出港计划查询。\n用户是执法人员或船方/代理，可协助查询船舶进出港历史、统计到港频次、分析船型分布、筛选航经桥梁船舶等。\n回答风格：数据驱动、统计精确、必要时给出表格或列表。`);
        // 注入 PlanStore 近6个月进出港计划数据摘要
        try{
          const plans = window.PlanStore ? PlanStore.getAll() : [];
          if(plans.length > 0){
            const shipMap = {};
            plans.forEach(p => {
              const name = p.shipName || '';
              if(!name) return;
              if(!shipMap[name]) shipMap[name] = { type:p.shipType||'', gt:p.gt||'', captain:p.captain||'', berth:p.berth||'', bridge:p.bridge||'', cargo:p.cargo||'', visits:[] };
              shipMap[name].visits.push(p.eta || p.date || '');
            });
            let ds = `\n\n[近6个月进出港计划库数据（共 ${plans.length} 条记录，${Object.keys(shipMap).length} 艘不同船舶）]\n`;
            Object.keys(shipMap).forEach(name => {
              const s = shipMap[name];
              const recent = s.visits.filter(Boolean).sort().reverse()[0] || '无';
              ds += `- ${name}（${s.type}，总吨${s.gt}，船长${s.captain}，常靠${s.berth}，航经${s.bridge}，货物${s.cargo}），近期到港：${recent}，共${s.visits.length}次记录\n`;
            });
            NanobotChat.appendContext(ds);
          }
        }catch(e){ console.warn('[Nanobot context]', e); }
        NanobotChat.bindPalette({
          input:'[x-ref="cmdkInput"]',
          suggestions:'[data-nb-ask]',
          closePalette:()=>{ self.cmdkOpen=false; }
        });
      };
      bindNb();
    },

    loadData(){
      if(!window.PlanStore) return;
      this.allPlans = PlanStore.getAll().sort(function(a,b){
        return (b.ingestAt||b.date||'').localeCompare(a.ingestAt||a.date||'');
      });

      // 提取船型列表
      var types = {};
      this.allPlans.forEach(function(p){ if(p.shipType) types[p.shipType]=true; });
      this.shipTypes = Object.keys(types).sort();

      // 提取码头列表（取前8个最常用的）
      var berths = {};
      this.allPlans.forEach(function(p){
        if(p.berth){
          // 归一化码头名称（去掉具体编号）
          var base = p.berth.replace(/\s*\d+\s*号.*$/, '').replace(/\s*[A-Z]\s*(区|泊位).*$/, '').trim();
          berths[base] = (berths[base]||0) + 1;
        }
      });
      this.berthOptions = Object.entries(berths).sort(function(a,b){ return b[1]-a[1]; }).slice(0,6).map(function(e){ return e[0]; });

      this.onSearch();
    },

    onSearch(){
      var q = (this.searchQuery || this.globalQuery || '').trim().toLowerCase();
      var from = this.dateFrom || '';
      var to = this.dateTo || '';
      var typeF = this.typeFilter;
      var berthF = this.berthFilter;

      this.filtered = this.allPlans.filter(function(p){
        // 关键词
        if(q){
          var haystack = [p.shipName, p.captain, p.phone, p.berth, p.shipType, p.cargo, p.gt, p.maxLength, p.date, p.bridge].join(' ').toLowerCase();
          if(haystack.indexOf(q) === -1) return false;
        }
        // 日期范围
        var d = p.date || (p.ingestAt ? p.ingestAt.slice(0,10) : '');
        if(from && d < from) return false;
        if(to && d > to) return false;
        // 船型
        if(typeF && p.shipType !== typeF) return false;
        // 码头
        if(berthF && p.berth && p.berth.indexOf(berthF) === -1) return false;
        return true;
      });

      this.currentPage = 1;
    },

    resetFilters(){
      this.searchQuery = '';
      this.globalQuery = '';
      this.dateFrom = '';
      this.dateTo = '';
      this.typeFilter = '';
      this.berthFilter = '';
      this.onSearch();
    },

    toggleTypeFilter(t){
      this.typeFilter = (this.typeFilter === t) ? '' : t;
      this.onSearch();
    },

    toggleBerthFilter(b){
      this.berthFilter = (this.berthFilter === b) ? '' : b;
      this.onSearch();
    },

    get pagedRows(){
      var start = (this.currentPage - 1) * this.pageSize;
      return this.filtered.slice(start, start + this.pageSize);
    },

    get totalPages(){
      return Math.max(1, Math.ceil(this.filtered.length / this.pageSize));
    },

    get visiblePages(){
      var total = this.totalPages;
      var cur = this.currentPage;
      var pages = [];
      var start = Math.max(1, cur - 2);
      var end = Math.min(total, cur + 2);
      if(end - start < 4){
        if(start === 1) end = Math.min(total, start + 4);
        else start = Math.max(1, end - 4);
      }
      for(var i = start; i <= end; i++) pages.push(i);
      return pages;
    },

    showDetail(row){
      this.detailRow = row;
      this.detailOpen = true;
    },

    goToRiskReport(row){
      if(row && row.shipName){
        location.href = 'risk-report-detail.html?name=' + encodeURIComponent(row.shipName);
      }
    },

    refreshKPI(){
      if(!window.PlanStore){
        this.kpis=[
          {label:'在库总量',value:'0',unit:'条',delta:'—',tone:'pill-info',color:'#0a1f44',note:'—'},
          {label:'船舶去重',value:'0',unit:'艘',delta:'—',tone:'pill-info',color:'#0a1f44',note:'—'},
          {label:'涉及码头',value:'0',unit:'个',delta:'—',tone:'pill-info',color:'#00a896',note:'—'},
          {label:'航经桥梁',value:'0',unit:'次',delta:'—',tone:'pill-warn',color:'#d97706',note:'需关注净空'},
        ];
        return;
      }
      var plans = this.allPlans;
      var uniqueShips = {};
      var uniqueBerths = {};
      var bridgeCount = 0;
      plans.forEach(function(p){
        if(p.shipName) uniqueShips[p.shipName] = true;
        if(p.berth) uniqueBerths[p.berth] = true;
        if(p.bridge && p.bridge !== '不适用') bridgeCount++;
      });
      var s = PlanStore.getStats();
      this.kpis=[
        {label:'在库总量',value:plans.length.toLocaleString(),unit:'条',delta:'6月滚动',tone:'pill-info',color:'#0a1f44',note:s.uploadCount + ' 次上传'},
        {label:'船舶去重',value:String(Object.keys(uniqueShips).length),unit:'艘',delta:'独立船舶',tone:'pill-info',color:'#0a1f44',note:'四字段联合去重'},
        {label:'涉及码头',value:String(Object.keys(uniqueBerths).length),unit:'个',delta:'泊位',tone:'pill-ok',color:'#00a896',note:'辖区全部码头'},
        {label:'航经桥梁',value:String(bridgeCount),unit:'次',delta:bridgeCount>0?'需关注':'—',tone:bridgeCount>0?'pill-warn':'pill-info',color:bridgeCount>0?'#d97706':'#0a1f44',note:'虎门大桥净空监控'},
      ];
    },

    exportCSV(){
      var rows = this.filtered;
      if(!rows.length){ alert('当前筛选无数据可导出'); return; }
      var headers = ['日期','船名','船型','船舶总吨','最大长度','靠泊码头','进港时间','离港时间','船长','联系方式','货物种类','货物数量','航经桥梁'];
      var lines = [headers.join(',')];
      rows.forEach(function(r){
        var vals = [r.date, r.shipName, r.shipType, r.gt, r.maxLength, r.berth, r.eta, r.etd, r.captain, r.phone, r.cargo, r.cargoQty, r.bridge];
        lines.push(vals.map(function(v){ return '"' + String(v||'').replace(/"/g,'""') + '"'; }).join(','));
      });
      var bom = '\uFEFF';
      var blob = new Blob([bom + lines.join('\n')], {type:'text/csv;charset=utf-8;'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = '进出港计划_' + new Date().toISOString().slice(0,10) + '.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    },
  };
}
</script>
</body>
</html>
